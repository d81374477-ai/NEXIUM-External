
name: Build NEXIUM APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk python3-pip zip unzip
          python3 -m pip install --user buildozer cython==0.29.36

      - name: Prepare Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"
          yes | python3 -m pip --version
          export PATH="$HOME/.local/bin:$PATH"
          buildozer android debug || true
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "build-tools;37.0.0"
          else
            echo "Android SDK command-line tools not found"
            exit 1
          fi

      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXIUM-External-v1.1.0-debug-apk
          path: bin/*.apk
